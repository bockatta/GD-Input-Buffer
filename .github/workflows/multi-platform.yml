# Builds Input Buffer for Windows, macOS, Android (32 + 64 bit) and iOS on GitHub's
# servers and combines them into ONE .geode that works on all of them.
# Push the project to a GitHub repo -> Actions tab -> "Build Geode Mod" ->
# the finished .geode is under "Artifacts" (Build Output).
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # iOS: Geode's newest bindings forget to include fmod.hpp in the generated
      # FMOD::Sound source on iOS ("incomplete type 'FMOD::Sound'"). Use a copy of
      # the bindings with that include added. Not our code - remove this step
      # once Geode fixes it upstream.
      - name: Patch Geode bindings (iOS)
        if: matrix.config.target == 'iOS'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/geode-sdk/bindings "$RUNNER_TEMP/bindings-repo"
          f="$RUNNER_TEMP/bindings-repo/bindings/2.2081/FMOD.bro"
          { echo '#import ios <fmod.hpp>'; cat "$f"; } > "$f.new" && mv "$f.new" "$f"
          head -3 "$f"
          echo "GEODE_BINDINGS_REPO_PATH=$RUNNER_TEMP/bindings-repo" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      # If a build fails, rebuild just the failing part and post its error
      # lines as an annotation (readable on the run page without opening logs).
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build/build.ninja ]; then
            cmake --build build -- -k 0 > errlog.txt 2>&1 || true
          else
            { echo "CMake configure failed:"; tail -n 60 build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null; } > errlog.txt
          fi
          grep -n -E -B2 -A4 "error|Error|undefined|ld:|FAILED" errlog.txt | head -n 120 > errs.txt || true
          [ -s errs.txt ] || tail -n 80 errlog.txt > errs.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' errs.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=${{ matrix.config.name }} build errors::$msg"
          exit 1

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
